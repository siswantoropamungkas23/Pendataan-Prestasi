<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestasi Anak Nusantara</title>
    <style>
        /* --- Reset & Gaya Dasar --- */
        :root {
            --primary-color: #3498db; /* Biru cerah */
            --secondary-color: #2ecc71; /* Hijau sukses */
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-bg: #ffffff;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* --- Kontainer Utama (Grid) --- */
        .main-container {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        /* Responsif untuk Layar HP */
        @media (max-width: 768px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }

        /* --- Gaya Panel Formulir --- */
        .form-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 20px;
        }

        .form-section h2 {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* --- Gaya Panel Daftar (List) --- */
        .list-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            box-shadow: var(--shadow);
        }

        .list-section h2 {
            margin-bottom: 20px;
            color: var(--text-color);
        }

        /* Container untuk Kartu-Kartu */
        .achievement-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* --- Gaya Kartu Prestasi (Achievement Card) --- */
        .achievement-card {
            background-color: #fff;
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 15px;
            position: relative;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .achievement-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .child-icon {
            font-size: 2rem;
            margin-right: 10px;
        }

        .child-info h3 {
            font-size: 1.1rem;
            margin-bottom: 2px;
        }

        .child-info p {
            font-size: 0.8rem;
            color: #7f8c8d;
        }

        .achievement-detail {
            font-size: 0.95rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .category-badge {
            display: inline-block;
            padding: 4px 8px;
            background-color: #e3f2fd;
            color: #1565c0;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-top: auto;
        }

        .btn-delete {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .achievement-card:hover .btn-delete {
            opacity: 1;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            color: #95a5a6;
            font-style: italic;
        }

    </style>
</head>
<body>

<div class="main-container">
    <!-- BAGIAN KIRI: FORMULIR INPUT -->
    <div class="form-section">
        <h2>🏆 Input Prestasi</h2>
        <form id="entry-form">
            <div class="form-group">
                <label for="child-name">Nama Lengkap Anak:</label>
                <input type="text" id="child-name" placeholder="Contoh: Andi Pratama" required>
            </div>
            
            <div class="form-group">
                <label for="child-age">Usia (Tahun):</label>
                <input type="number" id="child-age" placeholder="Contoh: 10" required>
            </div>

            <div class="form-group">
                <label for="achievement-category">Kategori Prestasi:</label>
                <select id="achievement-category" required>
                    <option value="" disabled selected>Pilih Kategori...</option>
                    <option value="Akademik">Akademik (Matematika, Sains, dll)</option>
                    <option value="Olahraga">Olahraga (Sepakbola, Renang, dll)</option>
                    <option value="Seni & Budaya">Seni & Budaya (Musik, Tari, dll)</option>
                    <option value="Kreativitas">Kreativitas & Inovasi</option>
                </select>
            </div>

            <div class="form-group">
                <label for="achievement-desc">Deskripsi Prestasi:</label>
                <textarea id="achievement-desc" placeholder="Jelaskan detail prestasinya..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Simpan Data</button>
        </form>
    </div>

    <!-- BAGIAN KANAN: DAFTAR PRESTASI -->
    <div class="list-section">
        <h2>Daftar Anak Berprestasi</h2>
        <div id="achievement-list" class="achievement-grid">
            <!-- Data akan muncul di sini dalam bentuk kartu -->
        </div>
    </div>
</div>

<script>
    const entryForm = document.getElementById('entry-form');
    const achievementList = document.getElementById('achievement-list');

    // Mengambil data yang tersimpan dari LocalStorage
    let students = JSON.parse(localStorage.getItem('studentAchievements')) || [];

    // Fungsi untuk menampilkan data dalam bentuk kartu
    function renderCards() {
        achievementList.innerHTML = '';

        if (students.length === 0) {
            achievementList.innerHTML = '<div class="empty-state">Belum ada data prestasi yang dimasukkan.</div>';
            return;
        }

        students.forEach((student, index) => {
            const card = document.createElement('div');
            card.className = 'achievement-card';
            
            // Logika untuk menampilkan icon berdasarkan kategori
            let icon = '🌟';
            if(student.category === 'Olahraga') icon = '⚽';
            if(student.category === 'Seni & Budaya') icon = '🎨';
            if(student.category === 'Kreativitas') icon = '💡';
            if(student.category === 'Akademik') icon = '🧠';

            card.innerHTML = `
                <button class="btn-delete" onclick="deleteEntry(${index})" title="Hapus Data">×</button>
                <div class="card-header">
                    <div class="child-icon">${icon}</div>
                    <div class="child-info">
                        <h3>${student.name}</h3>
                        <p>${student.age} Tahun</p>
                    </div>
                </div>
                <p class="achievement-detail">${student.description}</p>
                <span class="category-badge">${student.category}</span>
            `;
            achievementList.appendChild(card);
        });
    }

    // Fungsi untuk menangani submit form
    entryForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Mencegah reload halaman

        const name = document.getElementById('child-name').value;
        const age = document.getElementById('child-age').value;
        const category = document.getElementById('achievement-category').value;
        const description = document.getElementById('achievement-desc').value;

        // Menambahkan data baru ke array
        students.push({
            name,
            age,
            category,
            description
        });

        // Menyimpan array yang diperbarui ke LocalStorage
        localStorage.setItem('studentAchievements', JSON.stringify(students));

        // Mereset formulir dan menampilkan kartu baru
        entryForm.reset();
        renderCards();
    });

    // Fungsi untuk menghapus data berdasarkan index
    function deleteEntry(index) {
        if(confirm(`Apakah Anda yakin ingin menghapus data prestasi ${students[index].name}?`)) {
            students.splice(index, 1);
            localStorage.setItem('studentAchievements', JSON.stringify(students));
            renderCards();
        }
    }

    // Menampilkan data saat halaman pertama kali dimuat
    renderCards();

</script>

</body>
</html>
